<button id="dp-theme-toggle" class="dp-theme-toggle" type="button" aria-label="Alternar tema claro/escuro">
  <svg class="icon-sun" viewBox="0 0 20 20" fill="none" aria-hidden="true">
    <circle cx="10" cy="10" r="3.5" stroke="currentColor" stroke-width="1.6"/>
    <path d="M10 2v2M10 16v2M18 10h-2M4 10H2M15.5 4.5l-1.4 1.4M5.9 14.1l-1.4 1.4M15.5 15.5l-1.4-1.4M5.9 5.9L4.5 4.5"
      stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  </svg>
  <svg class="icon-moon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
    <path d="M17 11.5A7 7 0 1 1 8.5 3a5.5 5.5 0 0 0 8.5 8.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  </svg>
</button>
<script>
(function () {
  var btn = document.getElementById('dp-theme-toggle');
  if (!btn) return;

  // ---------- Alternância do Tema Claro/Escuro ----------
  var BOARD = { dark: 'rgb(10, 12, 17)', light: 'rgb(241, 238, 231)' };

  function paintBackground(theme) {
    var bg = BOARD[theme] || BOARD.dark;
    document.querySelectorAll('html, body, .reveal-viewport, .reveal').forEach(function (el) {
      el.style.setProperty('background-color', bg, 'important');
    });
  }

  function apply(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('dp-theme', theme); } catch (e) {}
    paintBackground(theme);
  }

  btn.addEventListener('click', function () {
    var current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    apply(current === 'light' ? 'dark' : 'light');
  });

  paintBackground(document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark');

  // ---------- Alinhamento no Topo (Lógica do Template Antigo) ----------
  var BASE_WIDTH = 1280;
  var BASE_HEIGHT = 720;
  var NARROW_BREAKPOINT = 600;

  function fitMobileCanvas() {
    if (!window.Reveal || typeof Reveal.configure !== 'function') return;

    var isNarrow = window.innerWidth < NARROW_BREAKPOINT;
    var height = isNarrow
      ? Math.round(BASE_WIDTH * (window.innerHeight / window.innerWidth))
      : BASE_HEIGHT;

    Reveal.configure({ width: BASE_WIDTH, height: height, center: false });
    Reveal.layout();
  }

  var resizeTimer = null;
  function scheduleFitMobileCanvas(delay) {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitMobileCanvas, delay || 120);
  }

  fitMobileCanvas();
  window.addEventListener('resize', function () { scheduleFitMobileCanvas(120); });
  window.addEventListener('orientationchange', function () { scheduleFitMobileCanvas(250); });

  if (window.matchMedia) {
    var mq = window.matchMedia('(max-width: ' + NARROW_BREAKPOINT + 'px)');
    var onBreakpointChange = function () { scheduleFitMobileCanvas(0); };
    if (mq.addEventListener) mq.addEventListener('change', onBreakpointChange);
    else if (mq.addListener) mq.addListener(onBreakpointChange);
  }
})();
</script>
